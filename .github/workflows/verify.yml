# Sprawdzenie ekranów (zarobki, historia, CSV, zatwierdzanie) w prawdziwej przeglądarce po teście obciążenia.
name: Sprawdzenie zarobkow

on:
  workflow_dispatch:
    inputs:
      approval: { description: 'Dodaj testowe auto i kierowcę (powiadomienia o zatwierdzaniu)', default: '0' }
      only: { description: 'Tylko wybrany test (settings)', default: '' }

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - run: npm install --no-save @supabase/supabase-js@2.45.4 playwright@1.47.2
      - run: npx playwright install --with-deps chromium
      - name: Sprawdzenie
        env:
          SB_URL: https://bmulsxfdpkaqogyfgygo.supabase.co
          LOAD_PASS: ${{ secrets.LOAD_PASS }}
          APPROVAL: ${{ inputs.approval }}
          ONLY: ${{ inputs.only }}
        run: |
          export SB_KEY=$(curl -fsS https://zielona-taxi.netlify.app/shared/config.js | grep -o "SUPABASE_ANON_KEY: '[^']*" | sed "s/.*'//")
          node tests/verify.mjs
