# Pobiera bibliotekę do porównywania twarzy (selfie kierowcy) i modele — do własnego hostingu w aplikacji Zetka Taxi
name: Biblioteka twarzy (vendor)
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  vendor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          V=1.7.15; B=https://cdn.jsdelivr.net/npm/@vladmandic/face-api@$V
          mkdir -p vendor/face; : > vendor/face/STATUS
          get() { code=$(curl -sSL -w '%{http_code}' -o "vendor/face/$2" "$B/$1"); echo "$code $1" >> vendor/face/STATUS; [ "$code" = 200 ] || rm -f "vendor/face/$2"; }
          get dist/face-api.esm.js face-api.esm.js
          for f in tiny_face_detector_model face_landmark_68_model face_recognition_model; do get model/$f.bin $f.bin; get model/$f-weights_manifest.json $f-weights_manifest.json; get model/$f.json $f.json; done
          curl -sSL "https://data.jsdelivr.com/v1/packages/npm/@vladmandic/face-api@$V?structure=flat" -o vendor/face/FILES.json || true
          get LICENSE LICENSE
          cat vendor/face/STATUS; ls -la vendor/face
      - run: |
          git config user.name "github-actions[bot]"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add vendor/face && git commit -m "Biblioteka twarzy face-api" && git push || true
