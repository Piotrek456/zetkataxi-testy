# Test obciążenia: wielu kierowców i klientów naraz na serwerze Zetka Taxi (tylko ręcznie).
# Konta testowe (48999…) zakłada i usuwa Claude w bazie; hasło w sekrecie LOAD_PASS.
name: Test obciążenia

on:
  workflow_dispatch:
    inputs:
      drivers: { description: 'Liczba kierowców', default: '40' }
      clients: { description: 'Liczba klientów', default: '80' }
      order_min: { description: 'Okno zamówień (min)', default: '4' }
      total_min: { description: 'Czas testu (min)', default: '12' }
      client_wait_min: { description: 'Cierpliwość klienta (min)', default: '4' }
      wait_share: { description: 'Część kursów z płatnym oczekiwaniem (0–1)', default: '0' }
      note: { description: 'Uwaga przy kursach testowych', default: 'TEST OBCIĄŻENIA' }

permissions:
  contents: read

jobs:
  load:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - run: npm install --no-save @supabase/supabase-js@2.45.4
      - name: Test
        env:
          SB_URL: https://bmulsxfdpkaqogyfgygo.supabase.co
          LOAD_PASS: ${{ secrets.LOAD_PASS }}
          DRIVERS: ${{ inputs.drivers }}
          CLIENTS: ${{ inputs.clients }}
          ORDER_MIN: ${{ inputs.order_min }}
          TOTAL_MIN: ${{ inputs.total_min }}
          CLIENT_WAIT_MIN: ${{ inputs.client_wait_min }}
          WAIT_SHARE: ${{ inputs.wait_share }}
          NOTE: ${{ inputs.note }}
          SHARD: ${{ matrix.shard }}
          SHARDS: 6
        run: |
          export SB_KEY=$(curl -fsS https://zielona-taxi.netlify.app/shared/config.js | grep -o "SUPABASE_ANON_KEY: '[^']*" | sed "s/.*'//")
          node tests/load.mjs
