# Buduje bazę adresów Zielonej Góry i powiatu zielonogórskiego z PRG (Geoportal) i zapisuje ją w data/.
name: Baza adresów (PRG)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Pobierz PRG (punkty adresowe, cała Polska, SHP)
        run: |
          mkdir -p prg && cd prg
          curl -fsSL --retry 3 -o polska.zip https://opendata.geoportal.gov.pl/prg/adresy/PunktyAdresowe/POLSKA.zip
          ls -la polska.zip && unzip -q polska.zip && find . -name '*.shp' | head
      - run: pip install pyshp pyproj
      - name: Wybierz Zieloną Górę i powiat zielonogórski
        run: python3 tools/adresy.py prg
      - name: Zapisz wynik
        run: |
          gzip -k -9 data/adresy-zg.json && ls -la data
          git config user.name "zt-bot"; git config user.email "zt-bot@users.noreply.github.com"
          git add data && git commit -m "Baza adresów ZG + powiat zielonogórski (PRG)" && git push
